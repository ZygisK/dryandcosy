name: Render pins
on:
  push:
    branches: [main]
    paths: [pins.yaml, make_pins.py, assets.yaml]
  workflow_dispatch:
    inputs:
      force:
        description: Re-render all pins
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright pyyaml pillow && (python -m playwright install chromium && python -m playwright install-deps chromium) || python -m playwright install chromium
      - run: python ops/fetch_assets.py
      - run: python make_pins.py ${{ inputs.force && '--force' || '' }}
      - name: Commit rendered pins
        run: |
          git config user.name "ZygisK"
          git config user.email "147195495+ZygisK@users.noreply.github.com"
          git add static/pins static/img
          git diff --cached --quiet || (git commit -m "Render pins" && git push)
