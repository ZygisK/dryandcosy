name: Publish pins
# One approved pin per run, three runs a day (times in UTC; Ireland is UTC+0/+1).
on:
  schedule:
    - cron: "17 8 * * *"
    - cron: "43 12 * * *"
    - cron: "11 19 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish-pins
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python publish_pins.py
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
      - name: Save posted status
        run: |
          git config user.name "ZygisK"
          git config user.email "147195495+ZygisK@users.noreply.github.com"
          git add pins.yaml
          git diff --cached --quiet || (git commit -m "Mark pin posted [skip ci]" && git pull --rebase && git push)
